<div class="table-responsive">
  <table class="table table-hover table-bordered align-middle shadow-sm">
    <thead class="table-dark">
      <tr>
        <th scope="col" class="text-center" style="width: 80px;">ID</th>
        <th scope="col">Título</th>
        <th scope="col">Director</th>
        <th scope="col" class="text-center" style="width: 100px;">Año</th>
        <th scope="col" class="text-center" style="width: 140px;">Género</th>
      </tr>
    </thead>
    <tbody>
      @for (movie of movies; track movie.id) {
        <tr>
          <td class="text-center fw-bold text-muted">{{ movie.id }}</td>
          <td class="fw-semibold text-primary">{{ movie.title }}</td>
          <td>{{ movie.director }}</td>
          <td class="text-center">
            <span class="badge" [ngClass]="movie.year >= 2020 ? 'bg-success' : (movie.year < 2000 ? 'bg-warning text-dark' : 'bg-secondary')">
              {{ movie.year }}
            </span>
          </td>
          <td class="text-center">
            <span class="badge bg-info text-dark">{{ movie.genre }}</span>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="text-center text-muted py-4">
            <i class="bi bi-film me-2"></i>No hay películas para mostrar en este criterio.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
